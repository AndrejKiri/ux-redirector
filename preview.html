<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Usability Study — UI Preview</title>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; background: #f6f7f9; color: #1a1a1a; }
    main { text-align: center; padding: 2rem; max-width: 32rem; }
    h1 { font-size: 1.75rem; }
    p { line-height: 1.6; color: #444; }
    .btn { display: inline-block; margin-top: 1.5rem; padding: 0.9rem 2.2rem; font-size: 1.1rem; border-radius: 8px; background: #1668e3; color: #fff; text-decoration: none; }
    .btn:hover { background: #0f52b5; }
  </style>
</head>
<body>
  <main>
    <h1>Welcome to the usability study</h1>
    <p>You are about to be taken to your personal workspace. Click the button below to start.</p>
    <a class="btn" href="#">Start the test</a>
  </main>
</body>
</html>
